services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sih-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: 3d_ulpin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: